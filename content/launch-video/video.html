<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weft launch video</title>
<style>
  @font-face { font-family: "Newsreader"; src: url("../../scripts/og/newsreader-latin.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Inst"; src: url("../../scripts/og/instrument-sans-latin.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; background: #0c0c0d; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0c0c0d; color: #f4f3ef; font-family: "Inst", sans-serif; -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .serif { font-family: "Newsreader", serif; font-weight: 400; letter-spacing: -0.02em; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .label { font-size: 21px; letter-spacing: 0.16em; text-transform: uppercase; color: #6f6e6a; }
  .muted { color: #a3a29d; } .faint { color: #6f6e6a; }
  /* a word behind a mask: it slides up into view */
  .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.06em 0.18em; margin: -0.04em -0.06em -0.18em; }
  .m > span { display: inline-block; transform: translateY(140%); }
  .hl { border-radius: 4px; background-repeat: no-repeat; padding: 0 4px; margin: 0 -4px; white-space: nowrap; }
  .tnum { font-variant-numeric: tabular-nums; }
  svg { overflow: visible; }
  svg text { font-family: "Inst", sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs id="defs">
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs></svg>
  <svg id="warp" width="1920" height="1080" style="position:absolute;inset:0"></svg>
  <div id="glowBg" style="position:absolute;inset:0"></div>

  <!-- logo (open and end) -->
  <div class="scene" id="s-logo">
    <svg width="1920" height="1080" style="position:absolute;inset:0">
      <g id="rings" fill="none"></g>
      <g id="threads" fill="none" stroke-linecap="round"></g>
      <circle id="knotRing" cx="960" cy="420" r="0" fill="none" stroke="#3ecf8e" stroke-width="2"/>
      <circle id="knot" cx="960" cy="420" r="0" fill="#f4f3ef" filter="url(#bloom)"/>
    </svg>
    <div class="center" id="wordmark" style="top:560px;font-size:150px;font-weight:600;letter-spacing:-0.045em"></div>
    <div class="center serif muted" id="tagline" style="top:760px;font-size:56px"></div>
    <div class="center" id="endExtras" style="top:880px"></div>
  </div>

  <!-- hook -->
  <div class="scene" id="s-hook">
    <div id="frags" style="position:absolute;inset:0"></div>
    <div class="center serif" id="hook1" style="top:380px;font-size:108px"></div>
    <div class="center serif muted" id="hook2" style="top:540px;font-size:84px"></div>
  </div>

  <!-- the sentence -->
  <div class="scene" id="s-prompt">
    <div class="center serif" id="promptLabel" style="top:150px;font-size:64px"></div>
    <div id="promptCard" style="position:absolute;left:230px;top:290px;width:1460px;padding:48px 64px 104px;box-sizing:border-box;border-radius:24px;background:linear-gradient(180deg,#17171a,#121214);border:1.5px solid #26262a;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 40px 120px rgba(0,0,0,0.5)">
      <div class="label" style="font-size:19px;margin-bottom:22px">New strategy</div>
      <div id="promptText" style="font-size:46px;line-height:1.5"></div>
      <div id="sendBtn" style="position:absolute;right:36px;bottom:30px;width:62px;height:62px;border-radius:16px;background:#f4f3ef;display:grid;place-items:center">
        <svg width="26" height="26" viewBox="0 0 20 20"><path d="M10 15V5M5 10l5-5 5 5" stroke="#0c0c0d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>

  <!-- the big diagram: built, then live -->
  <div class="scene" id="s-graph">
    <div class="center serif" id="gTitle1" style="top:70px;font-size:80px"></div>
    <div class="center serif" id="gTitle2" style="top:70px;font-size:80px"></div>
    <svg id="big" width="1920" height="1080" style="position:absolute;inset:0"></svg>
    <div id="gCaption" class="center muted" style="top:900px;font-size:32px"></div>
    <div id="clockRow" style="position:absolute;left:120px;right:120px;top:930px"></div>
  </div>

  <!-- montage of other strategies -->
  <div class="scene" id="s-montage">
    <div class="center serif" id="mTitle" style="top:70px;font-size:80px"></div>
    <div id="mSentenceBox" style="position:absolute;left:260px;right:260px;top:196px;height:110px;overflow:hidden"><div id="mSentence" style="text-align:center;font-size:36px;line-height:1.4"></div></div>
    <svg id="mSvg" width="1920" height="1080" style="position:absolute;inset:0"></svg>
  </div>

  <!-- every source is a thread -->
  <div class="scene" id="s-wall">
    <div class="serif" id="wallTitle" style="position:absolute;left:140px;top:84px;font-size:80px"></div>
    <div class="muted" id="wallSub" style="position:absolute;left:1180px;top:820px;width:640px;text-align:center;font-size:32px"></div>
    <div id="wallRows" style="position:absolute;left:140px;top:262px;width:880px"></div>
    <svg id="wallSvg" width="1920" height="1080" style="position:absolute;inset:0"></svg>
  </div>

  <!-- copy traders -->
  <div class="scene" id="s-copy">
    <div class="serif" id="copyTitle" style="position:absolute;left:140px;top:96px;font-size:80px"></div>
    <div class="muted" id="copyLead" style="position:absolute;left:144px;top:212px;font-size:32px"></div>
    <div id="table" style="position:absolute;left:140px;top:330px;width:820px"></div>
    <svg id="copySvg" width="1920" height="1080" style="position:absolute;inset:0"></svg>
    <div class="center muted" id="copySub" style="top:900px;font-size:34px"></div>
    <svg id="cursor" width="40" height="40" viewBox="0 0 24 24" style="position:absolute;left:0;top:0;opacity:0"><path d="M4 2l15 9-7 1.5L8.5 20z" fill="#f4f3ef" stroke="#0c0c0d" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>

  <!-- simple -->
  <div class="scene" id="s-simple">
    <div class="center serif" id="simpleTitle" style="top:150px;font-size:84px"></div>
    <div id="simpleText" style="position:absolute;left:0;top:330px;width:1920px;text-align:center;font-size:80px;letter-spacing:-0.025em;white-space:nowrap"></div>
    <svg id="simpleSvg" width="1920" height="1080" style="position:absolute;inset:0"></svg>
    <div id="ticket" style="position:absolute;left:260px;top:590px;width:1400px;height:240px"></div>
  </div>

  <!-- safety -->
  <div class="scene" id="s-safe">
    <div class="center serif" id="safeTitle" style="top:150px;font-size:88px"></div>
    <svg id="safeSvg" width="1920" height="1080" style="position:absolute;inset:0"></svg>
    <div class="center muted" id="safeSub" style="top:850px;font-size:40px"></div>
  </div>

  <div id="fly" style="position:absolute;inset:0"></div>
  <div id="wipe" style="position:absolute;top:0;bottom:0;left:0;width:2px;background:#f4f3ef;box-shadow:0 0 24px 4px rgba(244,243,239,0.45),0 0 90px 20px rgba(124,140,255,0.18);opacity:0"></div>
  <div id="flash" style="position:absolute;inset:0;opacity:0"></div>
  <div id="vig" style="position:absolute;inset:0;background:radial-gradient(ellipse 78% 78% at 50% 50%,transparent 58%,rgba(0,0,0,0.42) 100%)"></div>
  <div id="grain" style="position:absolute;inset:0;background-size:256px 256px"></div>
</div>

<script>
/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eox = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eix = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const eiox = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
/** Speed of f at t, per second. */
const vel = (f, t, h = 1 / 240) => (f(t + h) - f(t - h)) / (2 * h);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const div = (html, style = "", parent) => { const d = document.createElement("div"); d.innerHTML = html; d.style.cssText = style; if (parent) parent.appendChild(d); return d; };
const svgText = (parent, x, y, str, attrs = {}) => { const e = el("text", { x, y, ...attrs }, parent); e.textContent = str; return e; };
const CAPS = { "font-size": 19, "letter-spacing": 3, fill: "#6f6e6a" };
const C = { ink: "#f4f3ef", ink2: "#cfcec9", muted: "#a3a29d", faint: "#6f6e6a", line: "#26262a", line2: "#34343a", card: "#141416", paper: "#0c0c0d",
  blue: "#7c8cff", violet: "#a78bfa", amber: "#f5a524", pink: "#f472b6", sky: "#38bdf8", long: "#3ecf8e", short: "#ff6b6b" };
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, x) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], x))).join(",")})`; };
const DURATION = 73;

/** Per-scene directional motion blur (an SVG filter whose deviation is set every frame). */
const MB = {};
function mbFilter(id) {
  if (!MB[id]) { const f = el("filter", { id: `mb-${id}`, x: "-5%", y: "-5%", width: "110%", height: "110%" }, $("defs")); MB[id] = el("feGaussianBlur", { stdDeviation: "0 0" }, f); }
  return MB[id];
}
const filterOf = (id, bx, by, blur) => {
  const f = [];
  if (bx > 0.4 || by > 0.4) { mbFilter(id).setAttribute("stdDeviation", `${bx.toFixed(1)} ${by.toFixed(1)}`); f.push(`url(#mb-${id})`); }
  if (blur > 0.4) f.push(`blur(${blur.toFixed(1)}px)`);
  return f.length ? f.join(" ") : "none";
};
/** Place a scene: the camera. Returns false when it is off. */
function put(id, { o = 1, x = 0, y = 0, s = 1, ox = 960, oy = 540, blur = 0, bx = 0, by = 0, clip = "" } = {}) {
  const e = $(id);
  if (o <= 0.002) { e.style.opacity = 0; e.style.visibility = "hidden"; return false; }
  e.style.opacity = o; e.style.visibility = "visible";
  e.style.transformOrigin = `${ox}px ${oy}px`;
  e.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(5)})`;
  e.style.filter = filterOf(id, bx, by, blur);
  e.style.clipPath = clip || "none";
  return true;
}
/** Words behind masks. */
function maskWords(target, text) { target.innerHTML = text.split(" ").map((w) => `<span class="m"><span>${w}</span></span>`).join(" "); return [...target.querySelectorAll(".m > span")]; }
function maskChars(target, text) { target.innerHTML = [...text].map((w) => `<span class="m"><span>${w}</span></span>`).join(""); return [...target.querySelectorAll(".m > span")]; }
/** Slide words up into view from t0, and up out of view from `out`. */
function reveal(ws, t, t0, st = 0.05, d = 0.8, out = null) {
  ws.forEach((w, i) => {
    let y = (1 - eox(seg(t, t0 + i * st, t0 + i * st + d))) * 140;
    if (out != null) y -= eix(seg(t, out + i * st * 0.6, out + i * st * 0.6 + 0.45)) * 140;
    w.style.transform = `translateY(${y.toFixed(2)}%)`;
  });
}
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296 * 2 - 1; };
const srnd = (s) => () => ((s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296);

/* ================= finish: grid, glow, grain ================= */
for (let x = 24; x < 1920; x += 48) el("line", { x1: x, y1: 0, x2: x, y2: 1080, stroke: "#fff", "stroke-opacity": 0.022 }, $("warp"));
const GRAIN = Array.from({ length: 8 }, (_, k) => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), im = x.createImageData(256, 256), r = srnd(101 + k * 7919);
  for (let i = 0; i < im.data.length; i += 4) { const v = r(); const w = v > 0.5; im.data[i] = im.data[i + 1] = im.data[i + 2] = w ? 255 : 0; im.data[i + 3] = Math.abs(v - 0.5) * 2 * (w ? 11 : 22); }
  x.putImageData(im, 0, 0); return `url(${c.toDataURL()})`;
});

/* ================= logo ================= */
const KNOT = { x: 960, y: 420 };
const THREAD_C = [C.amber, C.pink, C.sky, C.blue, C.violet, C.long];
const threadEls = [
  `M -40 250 C 400 250 640 420 ${KNOT.x} ${KNOT.y}`,
  `M -40 335 C 420 335 660 420 ${KNOT.x} ${KNOT.y}`,
  `M -40 420 L ${KNOT.x} ${KNOT.y}`,
  `M -40 505 C 420 505 660 420 ${KNOT.x} ${KNOT.y}`,
  `M -40 590 C 400 590 640 420 ${KNOT.x} ${KNOT.y}`,
  `M ${KNOT.x} ${KNOT.y} L 1980 ${KNOT.y}`,
].map((d, i) => el("path", { d, stroke: THREAD_C[i], "stroke-width": i === 5 ? 5 : 3.5, opacity: 0.95 }, $("threads")));
const threadLen = threadEls.map((p) => p.getTotalLength());
const threadHeads = THREAD_C.map((c, i) => el("circle", { r: i === 5 ? 6 : 4.5, fill: c, filter: "url(#glow)", opacity: 0 }, $("threads")));
const tighten = [0, 1, 2].map(() => el("circle", { cx: KNOT.x, cy: KNOT.y, r: 0, stroke: C.ink, "stroke-width": 1.5, opacity: 0 }, $("rings")));
const wmChars = maskChars($("wordmark"), "weft");
const tagW = maskWords($("tagline"), "Trade the thesis.");
$("endExtras").innerHTML = `
  <span class="m" style="display:inline-block"><span style="display:flex;justify-content:center;gap:30px;align-items:center">
    <span style="font-size:42px;font-weight:600;letter-spacing:-0.015em">weft.fi</span>
    <span style="width:1.5px;height:34px;background:${C.line2}"></span>
    <span class="muted" style="font-size:34px">Live now</span>
  </span></span><br>
  <span class="m" style="display:inline-block;margin-top:30px"><span class="label" style="font-size:22px">Perps · Stocks · Prediction markets · Solana tokens</span></span>`;
const endW = [...$("endExtras").querySelectorAll(".m > span")];
const END = 67.6;
function drawLogo(t) {
  const end = t >= END - 0.05;
  if (!end && t > 3.6) return put("s-logo", { o: 0 });
  const l = t - (end ? END : 0);
  if (end) put("s-logo", { o: 1 });
  else { const z = eix(seg(t, 2.95, 3.55)); put("s-logo", { o: 1 - seg(t, 3.3, 3.55), s: 1 + 9 * z, ox: KNOT.x, oy: KNOT.y, blur: 16 * z }); }
  threadEls.forEach((p, i) => {
    const start = i < 5 ? 0.05 + i * 0.09 : 1.12;
    const pr = eio(seg(l, start, start + (i < 5 ? 1.05 : 1.0)));
    p.style.strokeDasharray = threadLen[i]; p.style.strokeDashoffset = threadLen[i] * (1 - pr);
    const h = threadHeads[i];
    if (pr > 0 && pr < 1) { const pt = p.getPointAtLength(threadLen[i] * pr); h.setAttribute("cx", pt.x); h.setAttribute("cy", pt.y); h.setAttribute("opacity", Math.pow(Math.sin(Math.PI * pr), 0.3)); } else h.setAttribute("opacity", 0);
  });
  // rings close in as the threads arrive, then the knot snaps tight
  tighten.forEach((c, i) => { const p = seg(l, 0.7 + i * 0.07, 1.12); c.setAttribute("r", lerp(150 - i * 30, 24, eio(p))); c.setAttribute("opacity", p > 0 && p < 1 ? Math.sin(Math.PI * p) * 0.45 : 0); });
  const k = seg(l, 1.05, 1.5);
  $("knot").setAttribute("r", Math.max(0, 22 * back(k) * (k > 0 ? 1 : 0)));
  const ring = seg(l, 1.15, 2.3); $("knotRing").setAttribute("r", 22 + 110 * eox(ring)); $("knotRing").setAttribute("opacity", ring > 0 ? (1 - ring) * 0.8 : 0);
  reveal(wmChars, l, 1.45, 0.05, 0.9);
  reveal(tagW, l, 1.95, 0.06, 0.9);
  reveal(endW, end ? l : -9, 2.6, 0.18, 0.9);
}

/* ================= hook ================= */
const hookW1 = maskWords($("hook1"), "You know what should happen.");
const hookW2 = maskWords($("hook2"), "You just can’t watch everything at once.");
// Everything you can't watch: live readings flicker on all around the line.
const FEED = [
  ["ETH", C.blue, (n) => (2431.4 + n * 1.8).toFixed(1)], ["Fear & Greed", C.amber, (n) => String(Math.round(34 + n * 2))],
  ["@elonmusk", C.amber, () => "new post"], ["BTC", C.blue, (n) => Math.round(81204 + n * 40).toLocaleString("en-US")],
  ["Fed cut odds", C.blue, (n) => `${Math.round(61 + n)}%`], ["$TSLA mentions", C.pink, (n) => `×${(2.3 + n * 0.2).toFixed(1)}`],
  ["Funding", C.violet, (n) => `${(0.0034 + n * 0.0004).toFixed(4)}%`], ["US 2Y", C.sky, (n) => `${(3.84 + n * 0.01).toFixed(2)}%`],
  ["TSLA", C.blue, (n) => `+${(2.1 + n * 0.1).toFixed(2)}%`], ["Headlines", C.sky, (n) => `Tesla ×${Math.round(7 + n)}`],
  ["0x7aa1…e8c2", C.long, () => "opened BTC 10×"], ["SOL", C.blue, (n) => (182.61 + n * 0.3).toFixed(2)],
  ["Gold", C.blue, (n) => (2640 + n * 3).toFixed(1)], ["Chicago", C.sky, (n) => `${(-5 + n * 0.4).toFixed(1)}°C`],
  ["7xKp…9fQe", C.long, () => "bought $PUMP"], ["HL fees", C.violet, (n) => `$${(5.2 + n * 0.05).toFixed(2)}M`],
  ["$SOL mentions", C.pink, (n) => `×${(1.9 + n * 0.2).toFixed(1)}`], ["Liquidity", C.sky, (n) => `$${(2.1 + n * 0.02).toFixed(2)}M`],
];
const fr = srnd(7);
const frags = [];
for (let r = 0; r < 9; r++) for (let c = 0; c < 7; c++) {
  const x = 60 + c * 250 + fr() * 60, y = 64 + r * 112 + fr() * 36;
  if (x + 230 > 300 && x < 1620 && y > 330 && y < 670) continue;
  const e = div("", `position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;font-size:22px;white-space:nowrap;opacity:0`, $("frags"));
  frags.push({ e, f: FEED[frags.length % FEED.length], x, y, base: 0.3 + fr() * 0.35 });
}
frags.forEach((g, i) => (g.ta = 4.55 + (i / frags.length) * 1.3 + fr() * 0.25));
function drawHook(t) {
  if (t < 3.15 || t > 6.8) return put("s-hook", { o: 0 });
  const z = eox(seg(t, 3.15, 3.95));
  put("s-hook", { o: seg(t, 3.15, 3.35), s: 0.84 + 0.16 * z, blur: (1 - z) * 12 });
  reveal(hookW1, t, 3.42, 0.06, 0.8, 5.85);
  reveal(hookW2, t, 4.45, 0.05, 0.8, 5.92);
  const k = Math.floor(t * 9);
  frags.forEach((g, i) => {
    const l = t - g.ta;
    if (l < 0) { g.e.style.opacity = 0; return; }
    const flick = l < 0.22 ? (Math.floor(l * 45) % 2 ? 0.2 : 1) : 1;
    const [name, color, fmt] = g.f;
    g.e.innerHTML = `<span style="color:${color}">${name}</span>&nbsp; <span class="tnum" style="color:${C.ink2}">${fmt(hash(i, k))}</span>`;
    // they all rush into the middle, where the sentence will be
    const q = eix(seg(t, 5.9 + (i % 7) * 0.025, 6.55));
    g.e.style.transform = `translate(${((960 - g.x - 110) * q).toFixed(1)}px, ${((560 - g.y) * q).toFixed(1)}px) scale(${1 - 0.75 * q})`;
    g.e.style.filter = q > 0.05 ? `blur(${(q * 6).toFixed(1)}px)` : "none";
    g.e.style.opacity = g.base * flick * Math.min(1, l / 0.05) * (1 - seg(q, 0.6, 1));
  });
}

/* ================= the sentence ================= */
const PROMPT = "If @elonmusk posts about flying cars at today’s Tesla event while $TSLA mentions on X triple, Tesla headlines keep coming, TSLA is up 2% and funding stays low, long TSLA 10x with $200. Take profit at 40%, stop at 15%, and sell if the buzz halves.";
const PHRASES = [
  { p: "@elonmusk posts about flying cars at today’s Tesla event", c: C.amber },
  { p: "$TSLA mentions on X triple", c: C.pink },
  { p: "Tesla headlines keep coming", c: C.sky },
  { p: "TSLA is up 2%", c: C.blue },
  { p: "funding stays low", c: C.violet },
  { p: "long TSLA 10x with $200", c: C.long },
  { p: "Take profit at 40%", c: C.long },
  { p: "stop at 15%", c: C.short },
  { p: "sell if the buzz halves", c: C.short },

});
/** An odometer: every digit spins down into place, the right-hand ones a few more turns. */
function odometer(target, str) {
  const digits = [...str].filter((ch) => /\d/.test(ch)).length;
  let j = 0;
  target.innerHTML = [...str].map((ch) => {
    if (!/\d/.test(ch)) return `<span style="display:inline-block">${ch}</span>`;
    const turns = 1 + (digits - 1 - j++);
    const stack = Array.from({ length: 10 * turns + Number(ch) + 1 }, (_, k) => `<span style="display:block;height:1.15em">${k % 10}</span>`).join("");
    return `<span class="od" data-k="${10 * turns + Number(ch)}" style="display:inline-block;height:1.15em;overflow:hidden;vertical-align:top"><span style="display:block">${stack}</span></span>`;
  }).join("");
  return [...target.querySelectorAll(".od")].map((o) => ({ inner: o.firstChild, k: Number(o.dataset.k) }));
}
tCols.forEach((c) => { if (c.rolls) c.odo = odometer(c.v, c.value); else c.v.textContent = c.value; });
const tFoot = div(`<span class="faint" style="font-size:26px">Market order on Hyperliquid</span><span id="tStatus" style="font-size:26px"></span>`, `position:absolute;left:0;right:0;top:${TB - TY + 30}px;display:flex;justify-content:space-between`, $("ticket"));
const SV = $("simpleSvg");
const hair = (y, color = C.line2, w = 1.5) => { const p = el("path", { d: `M ${TX} ${y} L ${TX + TLEN} ${y}`, stroke: color, "stroke-width": w, fill: "none" }, SV); p.dataset.len = TLEN; p.style.strokeDasharray = TLEN; return p; };
const hTop = hair(TY), hBot = hair(TB), hFill = hair(TY, C.long, 2.5);
let sTok = null;
function simpleLayout() {
  // measured once, after the fonts are in (offsets ignore the scene's transform)
  const box = $("simpleText");
  return SIMPLE_TOKENS.map(([w, color], i) => {
    const at = SIMPLE.indexOf(w), a = sChars[at], b = sChars[at + w.length - 1];
    const x0 = box.offsetLeft + a.offsetLeft, x1 = box.offsetLeft + b.offsetLeft + b.offsetWidth;
    const y = box.offsetTop + a.offsetTop + a.offsetHeight + 4;
    const under = el("path", { d: `M ${x0} ${y} L ${x1} ${y}`, stroke: color, "stroke-width": 4, "stroke-linecap": "round", fill: "none" }, SV);
    under.dataset.len = x1 - x0; under.style.strokeDasharray = x1 - x0;
    const cx = (x0 + x1) / 2, tx = TX + TCX[i] + 2;
    const drop = el("path", { d: `M ${cx} ${y + 10} C ${cx} ${y + 90}, ${tx} ${TY - 90}, ${tx} ${TY}`, stroke: color, "stroke-width": 2, "stroke-opacity": 0.7, fill: "none" }, SV);
    drop.dataset.len = drop.getTotalLength(); drop.style.strokeDasharray = drop.dataset.len;
    const land = el("circle", { cx: tx, cy: TY, r: 5, fill: color, opacity: 0, filter: "url(#glow)" }, SV);
    return { under, drop, land };
  });
}
const toSafe = (t) => eiox(seg(t, 63.0, 63.6));
function drawSimple(t) {
  if (t < WIPES[1] || t > 63.62) return put("s-simple", { o: 0 });
  const w = wipeAt(t, WIPES[1]), vy = Math.abs(vel((tt) => 1080 * toSafe(tt), t));
  put("s-simple", { x: 220 * (1 - w), y: -1080 * toSafe(t), by: Math.min(40, vy / 200), clip: w < 1 ? `inset(0 0 0 ${(1920 * (1 - w)).toFixed(1)}px)` : "" });
  const A = S.A;
  if (!sTok) sTok = simpleLayout();
  reveal(simpleTitle, t, A + 0.15, 0.05, 0.8);
  // typing
  const n = Math.floor(SIMPLE.length * seg(t, A + 0.5, A + 1.5));
  sChars.forEach((c, i) => (c.style.opacity = i < n ? 1 : 0));
  const last = sChars[Math.max(0, n - 1)];
  sCaret.style.left = `${n ? last.offsetLeft + last.offsetWidth + 4 : sChars[0].offsetLeft}px`;
  sCaret.style.opacity = t < A + 1.6 ? 1 : 0;
  // the four words are picked out and drop into the ticket
  const fade = 1 - seg(t, A + 3.4, A + 3.9);
  sTok.forEach((k, i) => {
    const u = eio(seg(t, A + 1.6 + i * 0.12, A + 1.95 + i * 0.12));
    k.under.style.strokeDashoffset = k.under.dataset.len * (1 - u);
    const d = eio(seg(t, A + 1.8 + i * 0.12, A + 2.35 + i * 0.12));
    k.drop.style.strokeDashoffset = k.drop.dataset.len * (1 - d);
    k.drop.style.opacity = fade;
    k.land.setAttribute("opacity", d >= 1 ? fade : 0);
  });
  const dim = eo(seg(t, A + 1.6, A + 2.1));
  sChars.forEach((c, i) => { if (!SIMPLE_TOKENS.some(([w]) => i >= SIMPLE.indexOf(w) && i < SIMPLE.indexOf(w) + w.length)) c.style.color = dim > 0 ? `rgba(244,243,239,${1 - 0.6 * dim})` : ""; });
  // the ticket
  const ht = eio(seg(t, A + 1.85, A + 2.6)), hb = eio(seg(t, A + 2.0, A + 2.75));
  hTop.style.strokeDashoffset = TLEN * (1 - ht); hBot.style.strokeDashoffset = TLEN * (1 - hb);
  tCols.forEach((c, i) => {
    const at = i < 4 ? A + 2.25 + i * 0.12 : A + 2.7 + (i - 4) * 0.15;
    const p = eox(seg(t, at, at + 0.6));
    c.c.style.opacity = p; c.c.style.transform = `translateY(${(1 - p) * 26}px)`;
    if (c.rolls) { const r = eo5(seg(t, at, at + 0.9)); c.odo.forEach((o) => (o.inner.style.transform = `translateY(${-o.k * r * 1.15}em)`)); }
  });
  // it fills
  const fillAt = A + 3.6, f = eio(seg(t, fillAt, fillAt + 0.5));
  hFill.style.strokeDashoffset = TLEN * (1 - f);
  hFill.setAttribute("filter", f > 0 ? "url(#glow)" : "");
  tFoot.style.opacity = eo(seg(t, A + 2.6, A + 3.0));
  $("tStatus").innerHTML = t >= fillAt ? `<span class="label" style="color:${C.long}">Filled</span><span class="tnum" style="margin-left:18px;color:${C.ink2}">0.8225 ETH</span>` : `<span class="faint">Sending…</span>`;
  $("tStatus").style.opacity = t >= fillAt ? eo(seg(t, fillAt, fillAt + 0.3)) : 1;
}

/* ================= safety ================= */
const safeTitle = maskWords($("safeTitle"), "Your money never leaves your wallet.");
const safeSub = maskWords($("safeSub"), "Weft can trade for you. It can’t withdraw.");
const SS = $("safeSvg");
const gWeft = el("g", {}, SS), gAcct = el("g", {}, SS);
el("rect", { x: 300, y: 400, width: 440, height: 250, rx: 18, fill: C.card, stroke: C.line2, "stroke-width": 1.5 }, gWeft);
svgText(gWeft, 344, 462, "WEFT", CAPS);
svgText(gWeft, 344, 528, "Trading-only key", { "font-size": 40, fill: C.ink, "font-weight": 500 });
svgText(gWeft, 344, 584, "Signs orders. Nothing else.", { "font-size": 25, fill: C.muted });
el("rect", { x: 1180, y: 370, width: 440, height: 310, rx: 18, fill: C.card, stroke: C.line2, "stroke-width": 1.5 }, gAcct);
svgText(gAcct, 1224, 432, "YOUR ACCOUNT · HYPERLIQUID", CAPS);
svgText(gAcct, 1224, 498, "$2,400.00", { "font-size": 54, fill: C.ink, "font-variant-numeric": "tabular-nums", "letter-spacing": -1 });
el("line", { x1: 1224, x2: 1576, y1: 528, y2: 528, stroke: C.line2, "stroke-width": 1.5 }, gAcct);
const POS = [["Long ETH 20×", "+$34.20", C.long], ["Long TSLA 10×", "+$12.80", C.long], ["Short SOL 5×", "−$3.10", C.short]];
const posRows = POS.map(([a, b, c], i) => { const g = el("g", { opacity: 0 }, gAcct); svgText(g, 1224, 572 + i * 40, a, { "font-size": 25, fill: C.ink2 }); svgText(g, 1576, 572 + i * 40, b, { "font-size": 25, fill: c, "text-anchor": "end", "font-variant-numeric": "tabular-nums" }); return g; });
const ordLine = el("path", { d: "M 740 470 L 1180 470", stroke: C.long, "stroke-width": 2, fill: "none" }, SS); ordLine.style.strokeDasharray = 440;
const ordLabel = svgText(SS, 960, 446, "ORDERS", { ...CAPS, fill: C.long, "text-anchor": "middle" });
const ordPulses = [0, 1, 2].map(() => el("circle", { r: 5.5, cy: 470, fill: C.long, filter: "url(#glow)", opacity: 0 }, SS));
const wdLine = el("path", { d: "M 1180 590 L 740 590", stroke: C.short, "stroke-width": 2, fill: "none", "stroke-dasharray": "10 10" }, SS);
const wdLabel = svgText(SS, 960, 650, "WITHDRAW", { ...CAPS, fill: C.short, "text-anchor": "middle" });
const gate = el("g", {}, SS);
const gateC = el("circle", { cx: 960, cy: 590, r: 26, fill: C.paper, stroke: C.short, "stroke-width": 2 }, gate);
el("rect", { x: 950, y: 588, width: 20, height: 15, rx: 3, fill: C.short }, gate);
el("path", { d: "M 954 588 v -5 a 6 6 0 0 1 12 0 v 5", stroke: C.short, "stroke-width": 2.5, fill: "none" }, gate);
const wdDot = el("circle", { r: 6, cy: 590, fill: C.short, filter: "url(#glow)", opacity: 0 }, SS);
const F = { A: 63.2, B: 67.8 };
function drawSafe(t) {
  if (t < 63.0 || t > 67.75) return put("s-safe", { o: 0 });
  const vy = Math.abs(vel((tt) => 1080 * toSafe(tt), t)), c = eix(seg(t, 67.25, 67.7));
  put("s-safe", { y: 1080 * (1 - toSafe(t)), by: Math.min(40, vy / 200), s: 1 - 0.97 * c, ox: 960, oy: 420, blur: 12 * c, o: 1 - seg(t, 67.5, 67.72) });
  const A = F.A;
  reveal(safeTitle, t, A + 0.45, 0.04, 0.8);
  [gWeft, gAcct].forEach((g, i) => { const p = eox(seg(t, A + 0.6 + i * 0.15, A + 1.3 + i * 0.15)); g.style.opacity = p; g.style.transform = `translateY(${((1 - p) * 30).toFixed(1)}px)`; });
  ordLine.style.strokeDashoffset = 440 * (1 - eio(seg(t, A + 1.0, A + 1.5))); ordLabel.style.opacity = eo(seg(t, A + 1.2, A + 1.6));
  // three orders go through, and each one shows up in the account
  ordPulses.forEach((d, i) => { const t0 = A + 1.3 + i * 0.7, p = seg(t, t0, t0 + 0.5); d.setAttribute("cx", lerp(740, 1180, eio(p))); d.setAttribute("opacity", p > 0 && p < 1 ? Math.pow(Math.sin(Math.PI * p), 0.5) : 0); const r = eox(seg(t, t0 + 0.45, t0 + 0.9)); posRows[i].setAttribute("opacity", r); posRows[i].style.transform = `translateY(${((1 - r) * 12).toFixed(1)}px)`; });
  const wl = eo(seg(t, A + 1.8, A + 2.3)); [wdLine, wdLabel, gate].forEach((e) => (e.style.opacity = wl));
  // a withdrawal tries to leave and stops dead at the lock, twice
  let hit = 0, dot = 0;
  [A + 2.2, A + 3.3].forEach((t0) => {
    const l = t - t0; if (l < 0 || l > 1.1) return;
    const x = l < 0.45 ? lerp(1180, 992, eix(seg(l, 0, 0.45)) * 0.6 + seg(l, 0, 0.45) * 0.4) : lerp(992, 1070, eox(seg(l, 0.45, 1.1)));
    wdDot.setAttribute("cx", x); dot = l < 0.45 ? 1 : 1 - seg(l, 0.45, 1.1);
    hit = Math.max(hit, l >= 0.45 ? Math.exp(-(l - 0.45) * 5) : 0);
  });
  wdDot.setAttribute("opacity", dot * wl);
  gateC.setAttribute("fill", mix(C.paper, C.short, hit * 0.35));
  gate.style.transform = `translateX(${(Math.sin(hit * 30) * hit * 4).toFixed(2)}px)`;
  wdLabel.textContent = t >= A + 2.65 ? "WITHDRAW · NOT PERMITTED" : "WITHDRAW";
  reveal(safeSub, t, A + 2.8, 0.04, 0.8);
}

/* ================= transitions that belong to no scene ================= */
function drawWipeLine(t) {
  const w = WIPES.map((t0) => wipeAt(t, t0)).find((x) => x > 0 && x < 1);
  if (w == null) { $("wipe").style.opacity = 0; return; }
  $("wipe").style.opacity = Math.sin(Math.PI * w) * 0.9 + 0.1;
  $("wipe").style.transform = `translateX(${(2140 * (1 - w) - 1).toFixed(1)}px)`;
}

/* ================= timeline ================= */
let laid = false;
function renderAt(t) {
  if (!laid) { measurePrompt(); laid = true; }
  drawLogo(t);
  drawHook(t);
  drawPrompt(t);
  drawGraph(t);
  drawFlight(t);
  drawMontage(t);
  drawWall(t);
  drawCopy(t);
  drawSimple(t);
  drawSafe(t);
  drawWipeLine(t);
  if (t < 33 || t > 36) $("flash").style.opacity = 0;
  const gx = 50 + 20 * Math.sin(t * 0.21), gy = 40 + 15 * Math.cos(t * 0.17);
  $("glowBg").style.background = `radial-gradient(1100px 700px at ${gx}% ${gy}%, rgba(124,140,255,0.07), transparent 70%)`;
  const fk = Math.floor(t * 24);
  $("grain").style.backgroundImage = GRAIN[fk % 8];
  $("grain").style.backgroundPosition = `${(hash(fk, 1) * 128).toFixed(0)}px ${(hash(fk, 2) * 128).toFixed(0)}px`;
}
window.DURATION = DURATION;
window.renderAt = renderAt;
window.CUES = { P, G, M, W, K, S, F, END, LIVE: LIVE.map((l) => l.met), promptLength: PROMPT.length };
if (!navigator.webdriver) {
  const q = new URLSearchParams(location.search);
  if (q.has("t")) document.fonts.ready.then(() => renderAt(Number(q.get("t"))));
  else { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; document.fonts.ready.then(loop); }
}
