<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How Weft works</title>
<style>
  @font-face { font-family: "Newsreader"; src: url("../../scripts/og/newsreader-latin.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Inst"; src: url("../../scripts/og/instrument-sans-latin.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; background: #0c0c0d; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0c0c0d; color: #f4f3ef; font-family: "Inst", sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Newsreader", serif; font-weight: 400; letter-spacing: -0.02em; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.06em 0.18em; margin: -0.04em -0.06em -0.18em; }
  .m > span { display: inline-block; transform: translateY(140%); }
  .tile { position: absolute; left: 0; top: 0; width: 410px; height: 150px; box-sizing: border-box; padding: 20px 22px; border-radius: 18px; background: linear-gradient(180deg, #19191c, #131315); border: 1.5px solid #29292e; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.45); opacity: 0; will-change: transform; transform-origin: 0 0; }
  .tile .logos { display: flex; align-items: center; }
  .tile .logos > * { margin-right: -8px; }
  .tile .label { margin-top: 14px; font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -0.015em; }
  .tile .bar { position: absolute; left: 22px; right: 22px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; }
  .chip { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; overflow: hidden; box-shadow: 0 0 0 3px #161618; }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip.pad img { width: 64%; height: 64%; object-fit: contain; }
  .pt { white-space: nowrap; height: 44px; padding: 0 14px; border-radius: 22px; background: #f3ebd6; color: #15120a; display: grid; place-items: center; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 17px; letter-spacing: -0.03em; box-shadow: 0 0 0 3px #161618; flex: none; }
  .pt i { font-style: normal; color: #881e20; }
  svg { overflow: visible; }
  .card { position: absolute; box-sizing: border-box; border-radius: 22px; background: linear-gradient(180deg, #18181b, #121214); border: 1.5px solid #29292e; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 40px 100px rgba(0,0,0,0.5); }
  .row { position: absolute; left: 0; width: 1240px; height: 104px; box-sizing: border-box; padding: 0 34px; display: flex; align-items: center; border-radius: 18px; background: linear-gradient(180deg, #19191c, #131315); border: 1.5px solid #29292e; will-change: transform; }
  .row .proto { width: 330px; margin-left: 22px; }
  .row .pname { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  .row .pmeta { font-size: 19px; color: #77766f; margin-top: 4px; }
  .row .track { position: relative; flex: 1; height: 10px; border-radius: 5px; background: #1f1f23; margin: 0 40px 0 10px; }
  .row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .row .rate { width: 150px; text-align: right; font-size: 44px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .row .best { position: absolute; right: -210px; font-size: 22px; letter-spacing: 0.16em; color: #3ecf8e; }
  .ledger { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; border-bottom: 1.5px solid #232327; font-size: 30px; }
  .ledger .k { color: #8a8983; }
  .ledger .v { font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .caret { display: inline-block; width: 3px; height: 1.05em; background: #f4f3ef; vertical-align: -0.15em; margin-left: 4px; }

  .chap { position: absolute; left: 110px; top: 70px; display: flex; align-items: center; gap: 18px; opacity: 0; }
  .chap .n { font-size: 20px; letter-spacing: 0.18em; color: #77766f; font-variant-numeric: tabular-nums; }
  .chap .t { font-size: 20px; letter-spacing: 0.18em; color: #f4f3ef; }
  .input { position: absolute; box-sizing: border-box; border-radius: 22px; background: linear-gradient(180deg, #18181b, #121214); border: 1.5px solid #2c2c31; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 40px 100px rgba(0,0,0,0.5); }
  .input .lbl { font-size: 18px; letter-spacing: 0.16em; color: #77766f; }
  .input .txt { margin-top: 18px; font-size: 50px; line-height: 1.25; letter-spacing: -0.02em; }
  .u { position: relative; }
  .u::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 4px; border-radius: 2px; background: var(--c); transform-origin: 0 50%; transform: scaleX(var(--k, 0)); }
  .col { position: absolute; top: 330px; width: 520px; }
  .col .h { font-size: 18px; letter-spacing: 0.18em; color: #77766f; margin-bottom: 18px; }
  .box { position: relative; box-sizing: border-box; height: 112px; margin-bottom: 18px; padding: 0 26px 0 30px; display: flex; align-items: center; gap: 18px; border-radius: 16px; background: linear-gradient(180deg, #19191c, #131315); border: 1.5px solid #29292e; }
  .box .edge { position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; }
  .box .k { font-size: 16px; letter-spacing: 0.14em; color: #77766f; }
  .box .v { margin-top: 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .lg { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; box-shadow: 0 0 0 3px #161618; }
  .lg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lg.pad img { width: 62%; height: 62%; object-fit: contain; }
  .node { position: absolute; width: 250px; height: 92px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 14px; border-radius: 14px; background: linear-gradient(180deg, #19191c, #131315); border: 1.5px solid #29292e; }
  .node .k { font-size: 14px; letter-spacing: 0.14em; color: #77766f; }
  .node .v { margin-top: 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .node .lg { width: 42px; height: 42px; }
  .card { position: absolute; left: 360px; top: 250px; width: 1200px; height: 520px; box-sizing: border-box; padding: 54px 64px; border-radius: 26px; background: linear-gradient(180deg, #1a1a1d, #121214); border: 1.5px solid #2c2c31; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 50px 120px rgba(0,0,0,0.55); will-change: transform; }
  .card .kick { font-size: 20px; letter-spacing: 0.18em; color: #77766f; }
  .card .logos { position: absolute; right: 64px; top: 46px; display: flex; }
  .card .logos > * { margin-left: -14px; width: 76px; height: 76px; box-shadow: 0 0 0 4px #1a1a1d; }
  .card .logos .lg { font-size: 26px; }
  .card .say { margin-top: 84px; font-size: 64px; line-height: 1.16; letter-spacing: -0.02em; }
  .card .res { position: absolute; left: 64px; bottom: 50px; display: flex; align-items: center; gap: 14px; font-size: 26px; color: #a3a29d; }
  .card .res b { color: #f4f3ef; font-weight: 600; }
  .card .bar { position: absolute; left: 64px; right: 64px; bottom: 0; height: 4px; border-radius: 4px 4px 0 0; }
  .ticket { position: absolute; box-sizing: border-box; border-radius: 18px; background: linear-gradient(180deg, #19191c, #131315); border: 1.5px solid #2f6b52; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs></svg>
  <svg id="grid" width="1920" height="1080" style="position:absolute;inset:0"></svg>
  <div id="glowBg" style="position:absolute;inset:0"></div>

  <!-- intro -->
  <div id="intro" style="position:absolute;inset:0">
    <svg width="1920" height="1080" style="position:absolute;inset:0"><g id="iThreads" fill="none" stroke-linecap="round"></g><circle id="iKnot" cx="960" cy="360" r="0" fill="#f4f3ef" filter="url(#bloom)"/></svg>
    <div class="center serif" id="iTitle" style="top:560px;font-size:120px"></div>
  </div>

  <div class="chap" id="chap"><div class="n" id="chapN"></div><div style="width:40px;height:1.5px;background:#3a3a40"></div><div class="t" id="chapT"></div></div>

  <!-- 01 say it -->
  <div class="input" id="inp" style="left:200px;top:390px;width:1520px;height:250px;padding:44px 56px;opacity:0"><div class="lbl">YOU SAY</div><div class="txt" id="inTxt"></div></div>

  <!-- 02 builds it -->
  <div id="cols" style="position:absolute;inset:0;opacity:0"></div>
  <div class="center" id="practice" style="top:930px;font-size:28px;color:#a3a29d;opacity:0"></div>

  <!-- 03 watches -->
  <div id="watch" style="position:absolute;inset:0;opacity:0">
    <svg width="1920" height="1080" style="position:absolute;inset:0"><g id="wThreads" fill="none" stroke-linecap="round"></g><circle id="wRing" cx="960" cy="560" r="0" fill="none" stroke="#3ecf8e" stroke-width="2"/><circle id="wKnot" cx="960" cy="560" r="20" fill="#f4f3ef" filter="url(#bloom)"/></svg>
    <div id="wNodes"></div>
    <div class="ticket" id="fill" style="left:660px;top:640px;width:600px;height:150px;padding:26px 32px;opacity:0"></div>
  </div>

  <!-- 04 wallet -->
  <div id="wallet" style="position:absolute;inset:0;opacity:0"></div>

  <!-- 05 anything -->
  <div id="deck" style="position:absolute;inset:0"></div>
  <div id="deckCount" style="position:absolute;right:110px;top:70px;font-size:20px;letter-spacing:0.18em;color:#77766f;font-variant-numeric:tabular-nums;opacity:0"></div>

  <!-- 06 token -->
  <div id="token" style="position:absolute;inset:0;opacity:0"></div>

  <!-- section titles -->
  <div class="center serif" id="sTitle" style="top:150px;font-size:76px"></div>

  <div id="end" style="position:absolute;inset:0;opacity:0">
    <svg width="1920" height="1080" style="position:absolute;inset:0">
      <g id="threads" fill="none" stroke-linecap="round"></g>
      <circle id="knotRing" cx="960" cy="400" r="0" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle id="knot" cx="960" cy="400" r="0" fill="#f4f3ef" filter="url(#bloom)"/>
    </svg>
    <div class="center" id="wordmark" style="top:500px;font-size:150px;font-weight:600;letter-spacing:-0.045em"></div>
    <div class="center serif" id="tagline" style="top:700px;font-size:60px;color:#a3a29d"></div>
    <div class="center" id="endUrl" style="top:850px;font-size:42px;font-weight:600;letter-spacing:-0.015em"></div>
  </div>

  <div id="prog" style="position:absolute;left:0;bottom:0;height:3px;background:#f4f3ef;opacity:0.25;width:0"></div>
  <div id="flash" style="position:absolute;inset:0;opacity:0;background:#f4f3ef;pointer-events:none"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 78% 78% at 50% 50%,transparent 58%,rgba(0,0,0,0.42) 100%);pointer-events:none"></div>
  <div id="grain" style="position:absolute;inset:0;background-size:256px 256px;pointer-events:none"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eox = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eix = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const div = (html, style = "", parent) => { const d = document.createElement("div"); d.innerHTML = html; d.style.cssText = style; if (parent) parent.appendChild(d); return d; };
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296 * 2 - 1; };
const srnd = (s) => () => ((s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296);
function maskWords(target, text) { target.innerHTML = text.split(" ").map((w) => `<span class="m"><span>${w}</span></span>`).join(" "); return [...target.querySelectorAll(".m > span")]; }
function maskChars(target, text) { target.innerHTML = [...text].map((w) => `<span class="m"><span>${w}</span></span>`).join(""); return [...target.querySelectorAll(".m > span")]; }
function reveal(ws, t, t0, st = 0.05, d = 0.8, out = null) {
  ws.forEach((w, i) => {
    let y = (1 - eox(seg(t, t0 + i * st, t0 + i * st + d))) * 140;
    if (out != null) y -= eix(seg(t, out + i * st * 0.6, out + i * st * 0.6 + 0.45)) * 140;
    w.style.transform = `translateY(${y.toFixed(2)}%)`;
  });
}

// Cascade Breathe, like the launch video: 130.01 BPM, downbeat 0.044 s; the film starts on the track's
// bar 1, so its drop (track bar 9) lands on film bar 8, where Weft starts watching.
const BAR = 240 / 130.01, B0 = 0.044;
const b = (n) => B0 + n * BAR;
const DURATION = b(32.4);

/* ---------- finish ---------- */
for (let x = 24; x < 1920; x += 48) el("line", { x1: x, y1: 0, x2: x, y2: 1080, stroke: "#fff", "stroke-opacity": 0.022 }, $("grid"));
const GRAIN = Array.from({ length: 8 }, (_, k) => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), im = x.createImageData(256, 256), r = srnd(101 + k * 7919);
  for (let i = 0; i < im.data.length; i += 4) { const v = r(); const w = v > 0.5; im.data[i] = im.data[i + 1] = im.data[i + 2] = w ? 255 : 0; im.data[i + 3] = Math.abs(v - 0.5) * 2 * (w ? 11 : 22); }
  x.putImageData(im, 0, 0); return `url(${c.toDataURL()})`;
});



/* ---------- assets ---------- */
const COIN = (s) => `../../apps/web/public/coins/${s}.svg`;
const LOGO = {
  SOL: `<div class="lg"><img src="${COIN("SOL")}"></div>`, BTC: `<div class="lg"><img src="${COIN("BTC")}"></div>`, ETH: `<div class="lg"><img src="${COIN("ETH")}"></div>`,
  HYPE: `<div class="lg"><img src="${COIN("HYPE")}"></div>`, USDC: `<div class="lg"><img src="${COIN("USDC")}"></div>`, JUP: `<div class="lg"><img src="${COIN("JUP")}"></div>`,
  NVDA: `<div class="lg"><img src="${COIN("NVDA")}"></div>`, GOLD: `<div class="lg"><img src="${COIN("GOLD")}"></div>`,
  WEFT: `<div class="lg"><img src="../../apps/web/public/token/weft-token.svg"></div>`,
  PM: `<div class="lg"><img src="logos/polymarket.png"></div>`, PT: `<div class="lg"><img src="logos/papertrade.png"></div>`,
  MET: `<div class="lg"><img src="logos/meteora.png"></div>`, FOMO: `<div class="lg"><img src="logos/fomo.png"></div>`,
  X: `<div class="lg pad" style="background:#f4f3ef"><img src="logos/x.svg"></div>`, CLAUDE: `<div class="lg pad" style="background:#f4f3ef"><img src="logos/claude.svg"></div>`,
  GPT: `<div class="lg" style="background:#fff"><img src="logos/openai.png" style="width:78%;height:78%;object-fit:contain"></div>`, CURSOR: `<div class="lg pad" style="background:#f4f3ef"><img src="logos/cursor.svg"></div>`,
  K: `<div class="lg" style="background:#232327;color:#cfcdc6;font-weight:600;font-size:22px">K</div>`,
  NEWS: `<div class="lg" style="background:#232327;color:#cfcdc6;font-weight:700;font-size:15px">NEWS</div>`,
  CAL: `<div class="lg" style="background:#232327;color:#cfcdc6;font-weight:700;font-size:15px">FOMC</div>`,
  WAL: `<div class="lg" style="background:#232327;color:#cfcdc6;font-weight:700;font-size:13px">0x…</div>`,
};
const C = { violet: "#a78bfa", amber: "#f5a524", pink: "#f472b6", red: "#f87171", sky: "#38bdf8", green: "#3ecf8e", blue: "#7c8cff" };

/* ---------- timing ---------- */
const T = { ch1: b(2), ch2: b(5), ch3: b(8), ch4: b(12), ch5: b(15), ch6: b(25), end: b(29.2) };
const CHAPS = [[T.ch1, "01", "SAY IT"], [T.ch2, "02", "WEFT BUILDS IT"], [T.ch3, "03", "IT WATCHES"], [T.ch4, "04", "FROM YOUR OWN WALLET"], [T.ch5, "05", "ANYTHING YOU CAN SAY"], [T.ch6, "06", "$WEFT"]];
const inWin = (t, a, z, fi = 0.4, fo = 0.4) => Math.min(eox(seg(t, a, a + fi)), 1 - eio(seg(t, z - fo, z)));

/* ---------- intro ---------- */
const IK = { x: 960, y: 360 };
const iCol = ["#f5a524", "#f472b6", "#38bdf8", "#7c8cff", "#a78bfa"];
const iPaths = [0, 1, 2, 3, 4].map((i) => {
  const y0 = 150 + i * 105;
  return el("path", { d: `M -40 ${y0} C 420 ${y0} 660 ${IK.y} ${IK.x} ${IK.y}`, stroke: iCol[i], "stroke-width": 3.5 }, $("iThreads"));
});
const iLen = iPaths.map((p) => p.getTotalLength());
const iTitle = maskWords($("iTitle"), "How Weft works.");
function drawIntro(t) {
  const out = eio(seg(t, T.ch1 - 0.5, T.ch1 + 0.1));
  $("intro").style.opacity = (1 - out).toFixed(3);
  iPaths.forEach((p, i) => {
    const k = eio(seg(t, 0.1 + i * 0.08, 1.1 + i * 0.08));
    p.style.strokeDasharray = iLen[i];
    p.style.strokeDashoffset = iLen[i] * (1 - k);
    p.setAttribute("opacity", (1 - 0.55 * eio(seg(t, 1.2, 1.9))).toFixed(3));
  });
  const kk = seg(t, 1.0, 1.4);
  $("iKnot").setAttribute("r", (18 * back(kk) * (kk > 0 ? 1 : 0)).toFixed(2));
  reveal(iTitle, t, 1.2, 0.07, 0.9);
}

/* ---------- chapter label + section titles ---------- */
const sTitles = {};
for (const [k, txt] of [["ch3", "It watches. Every second."], ["ch4", "Weft can trade. It can never withdraw."], ["ch5", "Anything you can say."], ["ch6", "Every fee buys $WEFT."]]) sTitles[k] = txt;
const sTitleEl = $("sTitle");
let sTitleKey = null, sTitleWords = [];
function drawChapter(t) {
  let cur = null;
  for (const c of CHAPS) if (t >= c[0] - 0.05) cur = c;
  const vis = cur && t < T.end - 0.3 ? 1 : 0;
  $("chap").style.opacity = (vis * eox(seg(t, T.ch1, T.ch1 + 0.5)) * (1 - eio(seg(t, T.end - 0.6, T.end - 0.2)))).toFixed(3);
  if (cur) { $("chapN").textContent = cur[1]; $("chapT").textContent = cur[2]; }
  $("prog").style.width = `${(clamp(t / DURATION) * 1920).toFixed(1)}px`;
  // a big serif line at the start of chapters 3–6
  const keys = [["ch3", T.ch3, T.ch3 + BAR * 1.6], ["ch4", T.ch4, T.ch5 - 0.2], ["ch5", T.ch5, T.ch5 + BAR * 0.95], ["ch6", T.ch6, T.end - 0.3]];
  const on = keys.find(([, a, z]) => t >= a && t < z);
  if (on && on[0] !== sTitleKey) { sTitleKey = on[0]; sTitleWords = maskWords(sTitleEl, sTitles[on[0]]); }
  if (on) {
    reveal(sTitleWords, t, on[1] + 0.05, 0.05, 0.7, on[2] - 0.45);
    sTitleEl.style.opacity = 1;
    sTitleEl.style.top = on[0] === "ch5" ? "470px" : "150px";
    sTitleEl.style.fontSize = on[0] === "ch5" ? "110px" : "76px";
  } else sTitleEl.style.opacity = 0;
}

/* ---------- 01 say it ---------- */
const SENT = [["Long SOL 10×", C.violet], [" if it "], ["breaks $110", C.amber], [" while "], ["funding stays low", C.pink], [". "], ["Stop at −8%", C.red], ["."]];
const FULL = SENT.map((s) => s[0]).join("");
function drawSay(t) {
  const a = T.ch1, z = T.ch2;
  const on = inWin(t, a + 0.1, z + BAR * 3, 0.5, 0.01);
  const lift = eio(seg(t, z - 0.2, z + 0.6)); // moves up for chapter 2
  const gone = eio(seg(t, T.ch3 - 0.5, T.ch3 + 0.1));
  const inp = $("inp");
  inp.style.opacity = (on * (1 - gone)).toFixed(3);
  inp.style.transform = `translateY(${(lerp(0, -250, lift) + (1 - eox(seg(t, a + 0.1, a + 0.6))) * 40).toFixed(1)}px) scale(${lerp(1, 0.78, lift).toFixed(4)})`;
  const n = Math.floor(clamp((t - (a + 0.6)) / (z - 0.6 - (a + 0.6))) * FULL.length);
  let html = "", used = 0;
  for (const [txt, col] of SENT) {
    const take = Math.max(0, Math.min(txt.length, n - used));
    const shown = txt.slice(0, take);
    used += txt.length;
    if (!shown) continue;
    if (col) {
      const done = take === txt.length;
      const k = done ? eox(seg(t, a + 0.6 + ((used / FULL.length) * (z - 1.2 - a)), a + 1.1 + ((used / FULL.length) * (z - 1.2 - a)))) : 0;
      html += `<span class="u" style="--c:${col};--k:${k.toFixed(3)}">${shown}</span>`;
    } else html += shown;
  }
  const typing = t < z - 0.6;
  $("inTxt").innerHTML = html + (typing || Math.floor(t * 2.2) % 2 === 0 ? '<span class="caret"></span>' : "");
}

const END = b(29.2);
const KNOT = { x: 960, y: 400 };
const THREAD_C = ["#f5a524", "#f472b6", "#38bdf8", "#7c8cff", "#a78bfa", "#93e3bc"];
const threadEls = [
  `M -40 230 C 400 230 640 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M -40 315 C 420 315 660 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M -40 ${KNOT.y} L ${KNOT.x} ${KNOT.y}`,
  `M -40 485 C 420 485 660 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M -40 570 C 400 570 640 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M ${KNOT.x} ${KNOT.y} L 1980 ${KNOT.y}`,
].map((d, i) => el("path", { d, stroke: THREAD_C[i], "stroke-width": i === 5 ? 5 : 3.5, opacity: 0.95 }, $("threads")));
const threadLen = threadEls.map((p) => p.getTotalLength());
const heads = THREAD_C.map((c, i) => el("circle", { r: i === 5 ? 6 : 4.5, fill: c, filter: "url(#glow)", opacity: 0 }, $("threads")));
const wm = maskChars($("wordmark"), "weft");
const tag = maskWords($("tagline"), "Trade the thesis.");
const url = maskWords($("endUrl"), "weft.fi");
function drawEnd(t) {
  if (t < END - 0.05) return void ($("end").style.opacity = 0);
  const l = t - END;
  $("end").style.opacity = Math.min(1, l / 0.2 + 0.25);
  threadEls.forEach((p, i) => {
    const start = i < 5 ? 0.05 + i * 0.07 : 0.95;
    const pr = eio(seg(l, start, start + 0.9));
    p.style.strokeDasharray = threadLen[i]; p.style.strokeDashoffset = threadLen[i] * (1 - pr);

  });

  const ring = seg(l, 0.95, 2.0); $("knotRing").setAttribute("r", 22 + 110 * eox(ring)); $("knotRing").setAttribute("opacity", ring > 0 ? (1 - ring) * 0.8 : 0);

  reveal(tag, l, 1.6, 0.06, 0.9);
  reveal(url, l, 2.2, 0.06, 0.9);
}



async function renderAt(t) {
  drawIntro(t); drawChapter(t); drawSay(t); drawBuild(t); drawWatch(t); drawWallet(t); drawDeck(t); drawToken(t); drawEnd(t);
  const fl = t >= FIRE ? Math.exp(-(t - FIRE) * 7) * 0.12 : 0;
  $("flash").style.opacity = fl.toFixed(3);
  const gx = 50 + 20 * Math.sin(t * 0.21), gy = 40 + 15 * Math.cos(t * 0.17);
  $("glowBg").style.background = `radial-gradient(1100px 700px at ${gx}% ${gy}%, rgba(167,139,250,0.06), transparent 70%)`;
  const fk = Math.floor(t * 24);
  $("grain").style.backgroundImage = GRAIN[fk % 8];
  $("grain").style.backgroundPosition = `${(hash(fk, 1) * 128).toFixed(0)}px ${(hash(fk, 2) * 128).toFixed(0)}px`;
}
window.DURATION = DURATION;
window.renderAt = renderAt;
window.ready = document.fonts.ready.then(() => Promise.all([document.fonts.load("600 40px Inst"), document.fonts.load("400 40px Newsreader"), ...[...document.images].map((im) => (im.complete ? null : new Promise((r) => (im.onload = im.onerror = r))))]));

  else { const t0 = performance.now(); const loop = async () => { await renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; window.ready.then(loop); }
}
