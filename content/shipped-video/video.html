<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weft: shipped since launch</title>
<style>
  @font-face { font-family: "Newsreader"; src: url("../../scripts/og/newsreader-latin.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Inst"; src: url("../../scripts/og/instrument-sans-latin.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; background: #0c0c0d; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0c0c0d; color: #f4f3ef; font-family: "Inst", sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Newsreader", serif; font-weight: 400; letter-spacing: -0.02em; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.06em 0.18em; margin: -0.04em -0.06em -0.18em; }
  .m > span { display: inline-block; transform: translateY(140%); }
  .tile { position: absolute; left: 0; top: 0; width: 410px; height: 150px; box-sizing: border-box; padding: 20px 22px; border-radius: 18px; background: linear-gradient(180deg, #19191c, #131315); border: 1.5px solid #29292e; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.45); opacity: 0; will-change: transform; transform-origin: 0 0; }
  .tile .logos { display: flex; align-items: center; }
  .tile .logos > * { margin-right: -8px; }
  .tile .label { margin-top: 14px; font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -0.015em; }
  .tile .bar { position: absolute; left: 22px; right: 22px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; }
  .chip { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; overflow: hidden; box-shadow: 0 0 0 3px #161618; }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip.pad img { width: 64%; height: 64%; object-fit: contain; }
  .pt { white-space: nowrap; height: 44px; padding: 0 14px; border-radius: 22px; background: #f3ebd6; color: #15120a; display: grid; place-items: center; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 17px; letter-spacing: -0.03em; box-shadow: 0 0 0 3px #161618; flex: none; }
  .pt i { font-style: normal; color: #881e20; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs></svg>
  <svg id="grid" width="1920" height="1080" style="position:absolute;inset:0"></svg>
  <div id="glowBg" style="position:absolute;inset:0"></div>

  <div id="intro">
    <div class="center serif" id="i1" style="top:380px;font-size:96px"></div>
    <div class="center serif" id="i2" style="top:520px;font-size:96px;color:#77766f"></div>
  </div>

  <div id="head" style="position:absolute;left:110px;right:110px;top:96px;display:flex;align-items:baseline;justify-content:space-between;opacity:0">
    <div id="headL" style="font-size:19px;letter-spacing:0.18em;color:#77766f">SHIPPED SINCE LAUNCH</div>
    <div id="count" class="tnum" style="font-size:30px;font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums"></div>
  </div>
  <div class="center serif" id="wallTitle" style="top:126px;font-size:64px"></div>
  <div id="wall"></div>

  <div id="end" style="position:absolute;inset:0;opacity:0">
    <svg width="1920" height="1080" style="position:absolute;inset:0">
      <g id="threads" fill="none" stroke-linecap="round"></g>
      <circle id="knotRing" cx="960" cy="400" r="0" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle id="knot" cx="960" cy="400" r="0" fill="#f4f3ef" filter="url(#bloom)"/>
    </svg>
    <div class="center" id="wordmark" style="top:500px;font-size:150px;font-weight:600;letter-spacing:-0.045em"></div>
    <div class="center serif" id="tagline" style="top:700px;font-size:60px;color:#a3a29d"></div>
    <div class="center" id="endUrl" style="top:850px;font-size:42px;font-weight:600;letter-spacing:-0.015em"></div>
  </div>

  <div id="flash" style="position:absolute;inset:0;opacity:0;background:#f4f3ef;pointer-events:none"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 78% 78% at 50% 50%,transparent 58%,rgba(0,0,0,0.42) 100%);pointer-events:none"></div>
  <div id="grain" style="position:absolute;inset:0;background-size:256px 256px;pointer-events:none"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eox = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eix = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const div = (html, style = "", parent) => { const d = document.createElement("div"); d.innerHTML = html; d.style.cssText = style; if (parent) parent.appendChild(d); return d; };
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296 * 2 - 1; };
const srnd = (s) => () => ((s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296);
function maskWords(target, text) { target.innerHTML = text.split(" ").map((w) => `<span class="m"><span>${w}</span></span>`).join(" "); return [...target.querySelectorAll(".m > span")]; }
function maskChars(target, text) { target.innerHTML = [...text].map((w) => `<span class="m"><span>${w}</span></span>`).join(""); return [...target.querySelectorAll(".m > span")]; }
function reveal(ws, t, t0, st = 0.05, d = 0.8, out = null) {
  ws.forEach((w, i) => {
    let y = (1 - eox(seg(t, t0 + i * st, t0 + i * st + d))) * 140;
    if (out != null) y -= eix(seg(t, out + i * st * 0.6, out + i * st * 0.6 + 0.45)) * 140;
    w.style.transform = `translateY(${y.toFixed(2)}%)`;
  });
}

// Cascade Breathe, like the launch video: 130.01 BPM, downbeat 0.044 s; the film starts on the track's
// bar 1, so its drop (track bar 9) lands on film bar 8, where the list speeds up.
const BAR = 240 / 130.01, B0 = 0.044;
const b = (n) => B0 + n * BAR;
const DURATION = b(14.4);

/* ---------- finish ---------- */
for (let x = 24; x < 1920; x += 48) el("line", { x1: x, y1: 0, x2: x, y2: 1080, stroke: "#fff", "stroke-opacity": 0.022 }, $("grid"));
const GRAIN = Array.from({ length: 8 }, (_, k) => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), im = x.createImageData(256, 256), r = srnd(101 + k * 7919);
  for (let i = 0; i < im.data.length; i += 4) { const v = r(); const w = v > 0.5; im.data[i] = im.data[i + 1] = im.data[i + 2] = w ? 255 : 0; im.data[i + 3] = Math.abs(v - 0.5) * 2 * (w ? 11 : 22); }
  x.putImageData(im, 0, 0); return `url(${c.toDataURL()})`;
});

/* ---------- logos ---------- */
const COIN = (s) => `../../apps/web/public/coins/${s}.svg`;
const WEFT_MARK = `<svg width="26" height="26" viewBox="0 0 48 48"><g fill="none" stroke="#0c0c0d" stroke-width="4.8" stroke-linecap="round"><path d="M8 13C20 13 21 24 30 24"/><path d="M8 24H30"/><path d="M8 35C20 35 21 24 30 24"/><path d="M30 24H40"/></g><circle cx="30" cy="24" r="5.8" fill="#0c0c0d"/></svg>`;
const L = {
  BTC: `<div class="chip"><img src="${COIN("BTC")}"></div>`,
  ETH: `<div class="chip"><img src="${COIN("ETH")}"></div>`,
  SOL: `<div class="chip"><img src="${COIN("SOL")}"></div>`,
  USDC: `<div class="chip"><img src="${COIN("USDC")}"></div>`,
  HYPE: `<div class="chip"><img src="${COIN("HYPE")}"></div>`,
  meteora: `<div class="chip"><img src="logos/meteora.png"></div>`,
  fomo: `<div class="chip"><img src="logos/fomo.png"></div>`,
  openai: `<div class="chip" style="background:#fff"><img src="logos/openai.png" style="width:78%;height:78%;object-fit:contain"></div>`,
  claude: `<div class="chip pad" style="background:#f4f3ef"><img src="logos/claude.svg"></div>`,
  cursor: `<div class="chip pad" style="background:#f4f3ef"><img src="logos/cursor.svg"></div>`,
  x: `<div class="chip pad" style="background:#f4f3ef"><img src="logos/x.svg"></div>`,
  rift: `<div class="chip" style="background:#1b1209"><img src="../x-banner/v2/assets/rift-logo-glow.svg" style="width:82%;height:82%;object-fit:contain"></div>`,
  weft: `<div class="chip" style="background:#f4f3ef">${WEFT_MARK}</div>`,
  token: `<div class="chip"><img src="../../apps/web/public/token/weft-token.svg"></div>`,
  pt: `<div class="pt">papertrade<i>_</i></div>`,
};
const C = ["#a78bfa", "#f472b6", "#38bdf8", "#f5a524", "#3ecf8e", "#7c8cff"];
const ITEMS = [
  [["BTC", "ETH", "pt"], "BTC and ETH up to 1000×, through Papertrade"],
  [["meteora", "SOL", "USDC"], "Liquidity pools on Meteora"],
  [["weft"], "Practice mode: $10,000, real prices"],
  [["rift", "BTC", "USDC"], "Fund from any chain, through Rift"],
  [["x", "weft"], "Tweet a trade to @weftfinance"],
  [["x"], "“Make this a strategy” under any post"],
  [["claude", "openai", "cursor"], "Weft inside Claude, ChatGPT and Cursor"],
  [["HYPE"], "Stops on every price update"],
  [["weft"], "Shareable result cards"],
  [["x"], "Connect X: tweets land in your account"],
  [["HYPE"], "Fade any Hyperliquid trader"],
  [["fomo"], "Copy or fade Fomo traders by username"],
  [["x", "SOL"], "Copy coin calls from any X account"],
  [["USDC"], "Add money without leaving the strategy"],
  [["weft"], "Every buyback and burn, on chain"],
  [["token"], "46M+ $WEFT burned"],
];

/* ---------- the wall: 4 × 4 ---------- */
const COLS = 4, TW = 410, TH = 150, GX = 20, GY = 18, X0 = 110, Y0 = 236;
const HERO = 2.25; // how big a tile is when it flies in
const tiles = ITEMS.map(([logos, label], i) => {
  const e = div(`<div class="logos">${logos.map((k) => L[k]).join("")}</div><div class="label">${label}</div><div class="bar" style="background:${C[i % C.length]}"></div>`, "", $("wall"));
  e.className = "tile";
  const col = i % COLS, row = Math.floor(i / COLS);
  return { e, x: X0 + col * (TW + GX), y: Y0 + row * (TH + GY), color: C[i % C.length] };
});
// When each one lands: 8 at 3/4 of a bar, then, from the drop, 8 at a quarter bar each.
const SLOT = ITEMS.map((_, i) => (i < 8 ? { t0: b(1.5) + i * 0.75 * BAR, d: 0.75 * BAR } : { t0: b(8) + (i - 8) * 0.25 * BAR, d: 0.25 * BAR }));
const landAt = (i) => SLOT[i].t0 + SLOT[i].d * 0.92;

function drawWall(t) {
  const wallOut = seg(t, b(12), b(12) + 0.7);
  let landed = 0;
  tiles.forEach((tl, i) => {
    const { t0, d } = SLOT[i];
    const appear = t0, hold = t0 + d * (i < 8 ? 0.5 : 0.35), land = t0 + d * 0.92;
    if (t < appear) { tl.e.style.opacity = 0; return; }
    const cx = 960 - (TW * HERO) / 2, cy = 540 - (TH * HERO) / 2 + 30;
    let x, y, s, o = 1, blur = 0;
    if (t < hold) {
      const k = eox(seg(t, appear, appear + Math.min(0.28, d * 0.4)));
      s = lerp(HERO * 0.72, HERO, k); x = 960 - (TW * s) / 2; y = cy + (1 - k) * 60 + (TH * HERO - TH * s) / 2; o = k; blur = (1 - k) * 14;
    } else {
      const k = eio(seg(t, hold, land));
      s = lerp(HERO, 1, k); x = lerp(cx, tl.x, k); y = lerp(cy, tl.y, k);
    }
    if (t >= land) landed++;
    // after the wall is full: one shimmer across it, then the wall steps back for the end card
    const wave = seg(t, b(10.2) + (i % COLS) * 0.06 + Math.floor(i / COLS) * 0.05, b(10.2) + 0.5 + (i % COLS) * 0.06 + Math.floor(i / COLS) * 0.05);
    const glow = t >= land ? Math.exp(-(t - land) * 5) + Math.sin(Math.PI * wave) * 0.7 : 0;
    tl.e.style.boxShadow = `inset 0 1px 0 rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.45), 0 0 ${Math.round(40 * glow)}px ${tl.color}${Math.round(clamp(glow) * 70).toString(16).padStart(2, "0")}`;
    tl.e.style.borderColor = glow > 0.05 ? tl.color : "#29292e";
    const out = eio(wallOut);
    tl.e.style.opacity = (o * (1 - out)).toFixed(3);
    tl.e.style.transform = `translate(${(x + (960 - x - TW / 2) * out * 0.15).toFixed(1)}px, ${(y + (540 - y) * out * 0.15).toFixed(1)}px) scale(${(s * (1 - out * 0.12)).toFixed(4)})`;
    tl.e.style.filter = blur > 0.4 ? `blur(${blur.toFixed(1)}px)` : "none";
    tl.e.style.zIndex = t < land ? 10 : 1;
  });
  const showHead = seg(t, b(1.5), b(1.5) + 0.4) * (1 - seg(t, b(10), b(10) + 0.3));
  $("head").style.opacity = showHead;
  $("count").textContent = `${String(landed).padStart(2, "0")} / 16`;
}

/* ---------- intro, title, end ---------- */
const I1 = maskWords($("i1"), "20 hours since $WEFT launched.");
const I2 = maskWords($("i2"), "Here’s what we shipped.");
const WT = maskWords($("wallTitle"), "16 things. 20 hours.");
function drawIntro(t) {
  reveal(I1, t, 0.15, 0.06, 0.85, b(1.5) - 0.45);
  reveal(I2, t, b(0.6), 0.06, 0.85, b(1.5) - 0.4);
  reveal(WT, t, b(10.05), 0.07, 0.8, b(12) - 0.2);
}
const END = b(12.4);
const KNOT = { x: 960, y: 400 };
const THREAD_C = ["#f5a524", "#f472b6", "#38bdf8", "#7c8cff", "#a78bfa", "#93e3bc"];
const threadEls = [
  `M -40 230 C 400 230 640 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M -40 315 C 420 315 660 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M -40 ${KNOT.y} L ${KNOT.x} ${KNOT.y}`,
  `M -40 485 C 420 485 660 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M -40 570 C 400 570 640 ${KNOT.y} ${KNOT.x} ${KNOT.y}`, `M ${KNOT.x} ${KNOT.y} L 1980 ${KNOT.y}`,
].map((d, i) => el("path", { d, stroke: THREAD_C[i], "stroke-width": i === 5 ? 5 : 3.5, opacity: 0.95 }, $("threads")));
const threadLen = threadEls.map((p) => p.getTotalLength());
const heads = THREAD_C.map((c, i) => el("circle", { r: i === 5 ? 6 : 4.5, fill: c, filter: "url(#glow)", opacity: 0 }, $("threads")));
const wm = maskChars($("wordmark"), "weft");
const tag = maskWords($("tagline"), "Day 2 starts soon.");
const url = maskWords($("endUrl"), "weft.fi");
function drawEnd(t) {
  if (t < END - 0.05) return void ($("end").style.opacity = 0);
  const l = t - END;
  $("end").style.opacity = Math.min(1, l / 0.2 + 0.25);
  threadEls.forEach((p, i) => {
    const start = i < 5 ? 0.05 + i * 0.07 : 0.95;
    const pr = eio(seg(l, start, start + 0.9));
    p.style.strokeDasharray = threadLen[i]; p.style.strokeDashoffset = threadLen[i] * (1 - pr);
    const h = heads[i];
    if (pr > 0 && pr < 1) { const pt = p.getPointAtLength(threadLen[i] * pr); h.setAttribute("cx", pt.x); h.setAttribute("cy", pt.y); h.setAttribute("opacity", 1); } else h.setAttribute("opacity", 0);
  });
  const k = seg(l, 0.9, 1.3);
  $("knot").setAttribute("r", Math.max(0, 22 * back(k) * (k > 0 ? 1 : 0)));
  const ring = seg(l, 0.95, 2.0); $("knotRing").setAttribute("r", 22 + 110 * eox(ring)); $("knotRing").setAttribute("opacity", ring > 0 ? (1 - ring) * 0.8 : 0);
  reveal(wm, l, 1.2, 0.05, 0.9);
  reveal(tag, l, 1.6, 0.06, 0.9);
  reveal(url, l, 2.2, 0.06, 0.9);
}

async function renderAt(t) {
  drawIntro(t); drawWall(t); drawEnd(t);
  const fl = t >= b(8) ? Math.exp(-(t - b(8)) * 7) * 0.13 : 0, fl2 = t >= landAt(15) ? Math.exp(-(t - landAt(15)) * 6) * 0.08 : 0;
  $("flash").style.opacity = (fl + fl2).toFixed(3);
  const gx = 50 + 20 * Math.sin(t * 0.21), gy = 40 + 15 * Math.cos(t * 0.17);
  $("glowBg").style.background = `radial-gradient(1100px 700px at ${gx}% ${gy}%, rgba(167,139,250,0.07), transparent 70%)`;
  const fk = Math.floor(t * 24);
  $("grain").style.backgroundImage = GRAIN[fk % 8];
  $("grain").style.backgroundPosition = `${(hash(fk, 1) * 128).toFixed(0)}px ${(hash(fk, 2) * 128).toFixed(0)}px`;
}
window.DURATION = DURATION;
window.renderAt = renderAt;
window.LAND = ITEMS.map((_, i) => landAt(i));
window.ready = document.fonts.ready.then(() => Promise.all([document.fonts.load("600 40px Inst"), document.fonts.load("400 40px Newsreader"), ...[...document.images].map((im) => (im.complete ? null : new Promise((r) => (im.onload = im.onerror = r))))]));
if (!navigator.webdriver) {
  const q = new URLSearchParams(location.search);
  if (q.has("t")) window.ready.then(() => renderAt(Number(q.get("t"))));
  else { const t0 = performance.now(); const loop = async () => { await renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; window.ready.then(loop); }
}
</script>
</body>
</html>
