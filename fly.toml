# Fly.io config for the Weft API. First time: `fly launch --no-deploy --copy-config`, then
# `fly volumes create weft_data --size 1`, set secrets (see docs/DEPLOY.md), and `fly deploy`.
app = "weft-api"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  WEFT_DATA_DIR = "/data"
  WEFT_HL_NETWORK = "testnet"

[mounts]
  source = "weft_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # The engine runs strategies on a schedule: keep one machine always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
